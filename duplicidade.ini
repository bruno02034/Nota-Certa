# Configuração do DuplicidadeNfce.exe (fica na mesma pasta do exe).
# Linhas com # são comentários. Formato: Opcao=valor

# Pasta raiz dos XMLs do Metre (estrutura MM_AAAA\DD\ e DD\Autorizadas\)
PastaRaiz=C:\Chef\NFCe

# Intervalo de datas das pastas de dia: dd/mm/aaaa, hoje, ontem ou -N (N dias atrás)
DataInicial=ontem
DataFinal=hoje
# Dias depois da DataFinal em que também se procuram os XMLs autorizados
DiasExtrasCandidatos=3

# Destino das cópias (Fase 2; essa pasta fica fora da varredura) e pasta dos relatórios
# (relativa ao exe, se não for caminho completo)
PastaDestino=C:\Chef\NFCe\Duplicidade
PastaRelatorios=relatorios

# SEFAZ: UF e ambiente (1 = produção, 2 = homologação). UrlConsulta vazio = URL oficial da UF.
UF=MG
Ambiente=1
UrlConsulta=
TimeoutSegundos=30
ValidarCertificadoServidor=sim

# Certificado A1 (.pfx). CertificadoPfx pode ser o arquivo ou a pasta onde ele está.
# As pastas PastaEmpresas\*\Certificado também são examinadas; vale o certificado
# cujo CNPJ é o do emitente das notas. Sem .pfx ou com senha errada, o relatório
# sai só com os arquivos e a SEFAZ fica como "não consultada".
# A senha não aparece no log nem no relatório.
CertificadoPfx=C:\Chef\Empresa\1\Certificado
PastaEmpresas=C:\Chef\Empresa
CertificadoSenha=
