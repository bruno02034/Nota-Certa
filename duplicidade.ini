# Configuração do DuplicidadeNfce.exe (fica na mesma pasta do exe).
# Linhas com # são comentários. Formato: Opcao=valor

# Pasta raiz dos XMLs do Metre (estrutura MM_AAAA\DD\ e DD\Autorizadas\)
PastaRaiz=C:\Chef\NFCe

# Intervalo de datas das pastas de dia: dd/mm/aaaa, hoje, ontem ou -N (N dias atrás)
DataInicial=ontem
DataFinal=hoje
# Dias depois da DataFinal em que também se procuram os XMLs autorizados
DiasExtrasCandidatos=3

# Destino das cópias (Fase 2; essa pasta fica fora da varredura) e pasta dos relatórios
# (relativa ao exe, se não for caminho completo)
PastaDestino=C:\Chef\NFCe\Duplicidade
PastaRelatorios=relatorios

# SEFAZ: UF e ambiente (1 = produção, 2 = homologação). UrlConsulta vazio = URL oficial da UF.
UF=MG
Ambiente=1
UrlConsulta=
TimeoutSegundos=30
ValidarCertificadoServidor=sim

# Certificado A1 (.pfx). CertificadoPfx pode ser o arquivo ou a pasta onde ele está.
# As pastas PastaEmpresas\*\Certificado também são examinadas; vale o certificado
# cujo CNPJ é o do emitente das notas. Sem .pfx ou com senha errada, o relatório
# sai só com os arquivos e a SEFAZ fica como "não consultada".
# A senha não aparece no log nem no relatório.
CertificadoPfx=C:\Chef\Empresa\1\Certificado
PastaEmpresas=C:\Chef\Empresa
CertificadoSenha=

# Lista da contingência: banco (chef.nota_saida, SOMENTE LEITURA), csv:<arquivo exportado do HeidiSQL> ou arquivos.
# Com "banco", a lista é exatamente a da aba Contingência do Metre. A única gravação no banco é o botão
# "Ajustar chave no banco" (só o campo chave_acesso de uma linha, com backup em backups\ ao lado do exe).
FonteContingencia=banco
# Host e porta vazios = os do Metre (IniConexaoMetre, [Configuracao] ip e porta).
DbHost=
DbPorta=
IniConexaoMetre=C:\Chef\Conexao.ini
DbUsuario=metre
# Senha do banco: NÃO digite aqui. A interface pede a senha ao abrir (ou em Configurações > Senha do banco) e a grava
# em DbSenhaProtegida, criptografada pelo Windows (só abre neste computador). Uma senha deixada em DbSenha é
# criptografada e apagada daqui na próxima abertura da interface.
DbSenha=
DbBanco=chef
# Banco onde o Metre guarda os XMLs (tabela xml, lida só para procurar o XML da chave autorizada)
DbBancoXml=chefxml
DbSituacao=Em contigencia
# libmariadb.dll: vazio = procura na instalação do MariaDB do Metre (PastaBancoMetre, com subpastas) e no HeidiSQL
MariaDbDll=
PastaBancoMetre=C:\Chef\Banco de Dados

# Notas Faltantes: pasta base das entregas (fica fora da varredura) e trava de quantidade de números por busca
PastaNotasFaltantes=C:\Chef\NFCe\NotasFaltantes
LimiteNumerosFaltantes=5000
